name: Renew DNS Cert

on:
  schedule:
    - cron: '0 3 1 */2 *'  # Bi-monthly on the 1st, 03:00 UTC (cert is valid 90 days)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write           # Release publishing requires write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Issue certificate (DNS-01 via Cloudflare)
        env:
          CF_Token: ${{ secrets.CF_TOKEN }}
        run: |
          curl -s https://get.acme.sh | sh
          ~/.acme.sh/acme.sh --issue --dns dns_cf -d dns.inceptae.com --server letsencrypt --force
          ~/.acme.sh/acme.sh --install-cert -d dns.inceptae.com \
            --key-file /tmp/key.pem --fullchain-file /tmp/cert.pem

      - name: Deploy to Aliyun server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/cert.pem /tmp/key.pem root@$SSH_HOST:/opt/adguard/conf/ssl/
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$SSH_HOST \
            'docker restart adguardhome && sleep 6 && docker ps --filter name=adguardhome --format "{{.Status}}" && openssl s_client -connect 127.0.0.1:853 -servername dns.inceptae.com </dev/null 2>/dev/null | grep "Verify return"'

      - name: Generate profile
        run: |
          chmod +x factory/build_agh.sh
          ./factory/build_agh.sh

      - name: Publish profile to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view profile >/dev/null 2>&1; then
            gh release upload profile dist/Cowjiang-AdGuard.mobileconfig --clobber
          else
            gh release create profile dist/Cowjiang-AdGuard.mobileconfig \
              --title "Cowjiang AdGuard Profile" \
              --notes "iOS DNS profile (DoT). Install: download the asset in Safari, open it in Files, then install. Rules update daily, no reinstall needed."
          fi
          echo "Download URL: https://github.com/Cowjiang/cowjiang-adguard/releases/download/profile/Cowjiang-AdGuard.mobileconfig"
