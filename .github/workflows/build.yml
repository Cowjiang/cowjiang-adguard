name: Build

on:
  schedule:
    - cron: '0 1 * * *'   # Daily at 01:00 UTC (after upstream updates at 00:00 UTC)
  push:
    branches:
      - master
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream rules (GMOogway/shadowrocket-rules)
        run: |
          curl -fsSL --retry 3 -o upstream/sr_reject_list.module \
            https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_reject_list.module
          head -3 upstream/sr_reject_list.module

      - name: Build AdGuard lists & profile
        run: |
          chmod +x factory/build_agh.sh
          ./factory/build_agh.sh

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/agh_custom_reject.txt dist/agh_sr_reject.txt dist/Cowjiang-AdGuard.mobileconfig upstream/sr_reject_list.module
          git diff --cached --quiet || git commit -m "build: daily update [skip ci]"
          git push

      - name: Publish profile to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view profile >/dev/null 2>&1; then
            gh release upload profile dist/Cowjiang-AdGuard.mobileconfig --clobber
          else
            gh release create profile dist/Cowjiang-AdGuard.mobileconfig \
              --title "Cowjiang AdGuard Profile" \
              --notes "iOS DNS profile (DoT). Install: download the asset in Safari, open it in Files, then install. Rules update daily, no reinstall needed."
          fi
